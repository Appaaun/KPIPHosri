services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kpi
      POSTGRES_USER: kpi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi -d kpi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  migrate:
    image: hospital-kpi:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kpi:${POSTGRES_PASSWORD}@postgres:5432/kpi
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
  web:
    image: hospital-kpi:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kpi:${POSTGRES_PASSWORD}@postgres:5432/kpi
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Set a random AUTH_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging
  worker:
    image: hospital-kpi:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kpi:${POSTGRES_PASSWORD}@postgres:5432/kpi
    command: ["npm", "run", "worker:dev"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
volumes:
  postgres-data:
    name: hospital-kpi-dev-data
